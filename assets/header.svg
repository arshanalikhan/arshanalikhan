ter-spacing="1" fill="#00f0ff">&gt; hello, world. I'm</text><text x="54" y="140" font-family="'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="60" font-weight="800" fill="url(#ink)" textLength="470" lengthAdjust="spacingAndGlyphs">Arshan Ali Khan</text><text x="56" y="190" font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#ff2a6d">$</text><path id="p0" d="m84,190 h0" fill="none"><animate id="t0" attributeName="d" begin="0s;t4.end" dur="4.5s" fill="remove" values="m84,190 h0;m84,190 h520;m84,190 h520;m84,190 h0" keyTimes="0;0.45;0.88;1"/></path><text font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#e6f0ff"><textPath xlink:href="#p0">AI/ML intern @ IIT Roorkee</textPath></text><path id="p1" d="m84,190 h0" fill="none"><animate id="t1" attributeName="d" begin="t0.end" dur="4.5s" fill="remove" values="m84,190 h0;m84,190 h520;m84,190 h520;m84,190 h0" keyTimes="0;0.45;0.88;1"/></path><text font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#e6f0ff"><textPath xlink:href="#p1">building AI for the built environment</textPath></text><path id="p2" d="m84,190 h0" fill="none"><animate id="t2" attributeName="d" begin="t1.end" dur="4.5s" fill="remove" values="m84,190 h0;m84,190 h520;m84,190 h520;m84,190 h0" keyTimes="0;0.45;0.88;1"/></path><text font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#e6f0ff"><textPath xlink:href="#p2">wrote a 32-bit OS from bare metal</textPath></text><path id="p3" d="m84,190 h0" fill="none"><animate id="t3" attributeName="d" begin="t2.end" dur="4.5s" fill="remove" values="m84,190 h0;m84,190 h520;m84,190 h520;m84,190 h0" keyTimes="0;0.45;0.88;1"/></path><text font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospac